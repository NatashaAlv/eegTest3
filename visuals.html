
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EEG Visual Experiment</title>

  <style>
    /* BASIC STYLING — CUSTOMIZE THIS LATER */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10101a;
      color: white;
      text-align: center;
    }

    header {
      padding: 20px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 65vh;
    }

    .controls {
      padding: 20px;
    }

    input {
      width: 250px;
      max-width: 80%;
    }

    button {
      padding: 10px 16px;
      margin: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <header>
    <h1>Reactive Visuals</h1>
    <p>Experiment 3: Can a signal control generative art?</p>
  </header>

  <canvas id="visual"></canvas>

  <div class="controls">
    <p>Input mode: <strong id="mode">Simulated</strong></p>

    <button id="autoButton">Turn Auto Mode Off</button>

    <p>Signal Value: <span id="value">50</span></p>
    <input
      id="signal"
      type="range"
      min="0"
      max="100"
      value="50"
    >

    <p>
      Move the slider to change the animation.
    </p>
  </div>

  <script>
    const canvas = document.getElementById("visual");
    const ctx = canvas.getContext("2d");

    const slider = document.getElementById("signal");
    const valueText = document.getElementById("value");
    const autoButton = document.getElementById("autoButton");
    const modeText = document.getElementById("mode");

    let signal = 50;
    let autoMode = true;
    let time = 0;
    let particles = [];

    // Create particles
    function createParticles() {
      particles = [];

      for (let i = 0; i < 180; i++) {
        particles.push({
          angle: Math.random() * Math.PI * 2,
          distance: Math.random(),
          size: Math.random() * 3 + 1,
          speed: Math.random() * 0.5 + 0.2
        });
      }
    }

    // Make canvas fit the screen
    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;

      canvas.width = canvas.clientWidth * dpr;
      canvas.height = canvas.clientHeight * dpr;

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function updateSignal(newValue) {
      signal = Number(newValue);
      slider.value = signal;
      valueText.textContent = signal;
    }

    // Manual signal control
    slider.addEventListener("input", () => {
      autoMode = false;
      autoButton.textContent = "Turn Auto Mode On";
      modeText.textContent = "Manual / Simulated";
      updateSignal(slider.value);
    });

    // Switch between manual and automatic input
    autoButton.addEventListener("click", () => {
      autoMode = !autoMode;

      autoButton.textContent = autoMode
        ? "Turn Auto Mode Off"
        : "Turn Auto Mode On";

      modeText.textContent = autoMode
        ? "Simulated"
        : "Manual / Simulated";
    });

    function animate() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;

      // Simulate a changing input
      if (autoMode) {
        updateSignal(
          50 + 40 * Math.sin(time * 0.015)
        );
      }

      time++;

      ctx.clearRect(0, 0, width, height);

      // Signal controls the particle spread
      const intensity = signal / 100;
      const centerX = width / 2;
      const centerY = height / 2;
      const spread = 40 + intensity * Math.min(width, height) * 0.35;

      particles.forEach((particle) => {
        const angle =
          particle.angle +
          time * 0.002 * particle.speed * (0.5 + intensity);

        const distance = particle.distance * spread;

        const x = centerX + Math.cos(angle) * distance;
        const y = centerY + Math.sin(angle) * distance;

        const size = particle.size * (0.5 + intensity);

        // Alternate particle colours
        const colours = [
          "#62f4ff",
          "#ff62c6",
          "#9b83ff"
        ];

        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.fillStyle =
          colours[Math.floor(particle.distance * 10) % 3];
        ctx.fill();
      });

      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", resizeCanvas);

    createParticles();
    resizeCanvas();
    animate();
  </script>
</body>
</html>
